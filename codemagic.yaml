# ============================================================
# 7PRO Management - Codemagic CI/CD Configuration
# ============================================================
#
# SETUP INSTRUCTIONS:
# 1. Connect your GitHub repo to Codemagic
# 2. Upload your keystore at: Team settings > codemagic.yaml settings > Code signing identities > Android keystores
#    - Reference name: sevenpro-keystore
#    - Keystore password, Key alias, Key password
# 3. In Codemagic > Environment variables, create group "sevenpro_credentials":
#    - SUPABASE_URL: Your Supabase project URL
#    - SUPABASE_ANON_KEY: Your Supabase anon/public key
#    - PLAY_STORE_JSON_KEY: Google Play Console service account JSON (optional, for auto-deploy)
#
# ============================================================

workflows:
  # ─── Pull Request Validation ───────────────────────────────
  pr-validation:
    name: PR Validation
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - sevenpro_credentials
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Set up JDK
        script: |
          #!/bin/bash
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
      - name: Setup local.properties
        script: |
          #!/bin/bash
          echo "SUPABASE_URL=$SUPABASE_URL" > local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Make gradlew executable
        script: chmod +x gradlew
      - name: Install dependencies
        script: ./gradlew dependencies
      - name: Run Lint
        script: ./gradlew lintDebug
      - name: Run Unit Tests
        script: ./gradlew testDebugUnitTest
      - name: Build Debug APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/**/*.apk

  # ─── Production Build & Deploy ─────────────────────────────
  production-build:
    name: Production Build & Deploy
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - sevenpro_credentials
      android_signing:
        - sevenpro-keystore
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Set up environment
        script: |
          #!/bin/bash
          echo "Building 7PRO Management"
          echo "Branch: $BRANCH"
          echo "Commit: $COMMIT"
      - name: Setup local.properties
        script: |
          #!/bin/bash
          echo "SUPABASE_URL=$SUPABASE_URL" > local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Make gradlew executable
        script: chmod +x gradlew
      - name: Install dependencies
        script: ./gradlew dependencies
      - name: Run Tests
        script: ./gradlew testReleaseUnitTest
      - name: Build Release APK
        script: ./gradlew assembleRelease
      - name: Build Release AAB
        script: ./gradlew bundleRelease
      - name: Generate Version Info
        script: |
          #!/bin/bash
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed "s/.*versionName = \"\(.*\)\"/\1/")
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed "s/.*versionCode = \(.*\)/\1/")
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          echo "VERSION_NAME=$VERSION_NAME" > build_info.txt
          echo "VERSION_CODE=$VERSION_CODE" >> build_info.txt
          echo "BUILD_DATE=$(date)" >> build_info.txt
    artifacts:
      - app/build/outputs/apk/release/**/*.apk
      - app/build/outputs/bundle/release/**/*.aab
      - build_info.txt
    publishing:
      email:
        recipients:
          - admin@sevenpro.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $PLAY_STORE_JSON_KEY
        track: internal

  # ─── Beta Build (for testing) ──────────────────────────────
  beta-build:
    name: Beta Build
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      groups:
        - sevenpro_credentials
      android_signing:
        - sevenpro-keystore
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'develop'
          include: true
        - pattern: 'release/*'
          include: true
    scripts:
      - name: Setup local.properties
        script: |
          #!/bin/bash
          echo "SUPABASE_URL=$SUPABASE_URL" > local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Make gradlew executable
        script: chmod +x gradlew
      - name: Install dependencies
        script: ./gradlew dependencies
      - name: Build Beta APK
        script: ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - admin@sevenpro.com
        notify:
          success: true
          failure: true
